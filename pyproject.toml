[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-review-bot"
version = "0.1.0"
description = "Harness engineering for a PR review bot"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["github", "bot", "reviews", "harness"]
license = { text = "MIT" }

[tool.poetry]

[tool.black]
line-length = 88

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["app"]
